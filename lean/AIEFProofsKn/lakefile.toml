name = "AIEFProofsKn"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AIEFProofsKn"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# The pinned base project (lean/AIEFProofs), used read-only for `CompleteGraphIncidence.inc`.
[[require]]
name = "AIEFProofs"
path = "../AIEFProofs"

[[lean_lib]]
name = "AIEFProofsKn"
